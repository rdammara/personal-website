# Builds the static site and deploys it to Cloudflare Pages.
#   master       -> albertdammara.com (and hourly, to pick up new posts, projects and resume)
#   development  -> a preview at development.albertdammara.pages.dev
name: Build and deploy

on:
  push:
    branches: [master, development]
  schedule:
    - cron: '17 * * * *' # hourly; GitHub runs schedules on the default branch (master)
  workflow_dispatch: # "Run workflow" button, to publish right away

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # wrangler needs 22+
          cache: npm

      - run: npm ci

      - name: Fetch posts, projects and resume
        run: npm run content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # raises GitHub's API rate limit

      - name: Build the static site
        run: npm run build

      - name: Create the Pages project if it doesn't exist yet
        run: npx wrangler pages project create albertdammara --production-branch=master || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Give the ask bar its OpenRouter key
        if: ${{ github.ref_name == 'master' }}
        run: printf '%s' "$OPENROUTER_API_KEY" | npx wrangler pages secret put OPENROUTER_API_KEY --project-name=albertdammara
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy --branch=${{ github.ref_name }} --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
