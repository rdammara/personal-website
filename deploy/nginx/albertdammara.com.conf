# nginx site for albertdammara.com, matching what runs on the server
# (/etc/nginx/sites-available/albertdammara.com.conf), certbot's lines included.
#
# After a change here is merged and deployed, apply it with:
#   sudo cp ~/apps/albertdammara.com/current/deploy/nginx/albertdammara.com.conf /etc/nginx/sites-available/
#   sudo nginx -t && sudo systemctl reload nginx

# Per-visitor limits for the two endpoints worth abusing
limit_req_zone $binary_remote_addr zone=pw_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=pw_ask:10m rate=20r/m;

# Requests for any other host name (the bare IP, scanners) get no answer
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Plain HTTP: every visit moves to the canonical HTTPS address
server {
    listen 80;
    server_name albertdammara.com www.albertdammara.com;
    return 301 https://albertdammara.com$request_uri;
}

# www over HTTPS: same, so search engines see one site
server {
    listen 443 ssl;
    server_name www.albertdammara.com;

    ssl_certificate /etc/letsencrypt/live/albertdammara.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/albertdammara.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://albertdammara.com$request_uri;
}

server {
    listen 443 ssl;
    server_name albertdammara.com;

    ssl_certificate /etc/letsencrypt/live/albertdammara.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/albertdammara.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Resume uploads are up to 10 MB
    client_max_body_size 11m;

    # Browsers use HTTPS only for a year after a visit. No includeSubDomains or
    # preload: both are hard to undo and nothing here needs them.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SAMEORIGIN, not DENY: the resume page embeds the resume PDF from this site
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 5 sign-in attempts a minute per visitor, with a small burst
    location = /api/auth/login {
        limit_req zone=pw_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    # 20 ask-bar questions a minute per visitor
    location = /api/chat {
        limit_req zone=pw_ask burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
