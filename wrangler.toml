# Cloudflare Pages project for albertdammara.com. GitHub Actions deploys out/ (the static
# site) together with functions/ (the ask bar). OPENROUTER_API_KEY is a secret set on the
# project, not here.
name = "albertdammara"
pages_build_output_dir = "./out"
compatibility_date = "2026-10-15"

[vars]
# One model, or a comma-separated list tried in order
OPENROUTER_MODEL = "openrouter/free"
